[package]
name = "w9pt-fs"
version = "0.1.0-dev"
publish = false
edition = "2024"
rust-version = "1.94.1"
description = "Runtime-neutral filesystem semantic engine for w9pt"
license = "Apache-2.0"
readme = "README.md"
keywords = ["9p", "filesystem", "distributed", "sans-io"]
categories = ["filesystem"]

[dependencies]
w9pt = { path = "../w9pt" }
w9pt-fs-state = { path = "../w9pt-fs-state" }
w9pt-fs-storage = { path = "../w9pt-fs-storage" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
