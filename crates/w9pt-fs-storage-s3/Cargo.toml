[package]
name = "w9pt-fs-storage-s3"
version = "0.1.0-dev"
publish = false
edition = "2024"
rust-version = "1.94.1"
description = "Amazon S3 target-store adapter for w9pt immutable content storage"
license = "Apache-2.0"
readme = "README.md"
keywords = ["9p", "filesystem", "s3", "object-storage"]
categories = ["filesystem"]

[dependencies]
aws-sdk-s3 = { version = "=1.145.0", default-features = false, features = ["rt-tokio"] }
tokio = { version = "1.53.1", features = ["time"] }
w9pt-fs-storage = { path = "../w9pt-fs-storage" }

[features]
default = ["default-https-client"]
default-https-client = ["aws-sdk-s3/default-https-client"]

[dev-dependencies]
aws-config = { version = "=1.12.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.145.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.4.0", default-features = false, features = ["test-util"] }
aws-smithy-types = "1.6.3"
http-1x = { package = "http", version = "1.5.0" }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
