[package]
name = "w9pt-fs-storage"
version = "0.1.0-dev"
publish = false
edition = "2024"
rust-version = "1.94.1"
description = "Backend-neutral immutable content storage methods for w9pt"
license = "Apache-2.0"
readme = "../../README.md"
keywords = ["9p", "filesystem", "object-storage"]
categories = ["filesystem"]

[dependencies]
blake3 = "1.8.2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
