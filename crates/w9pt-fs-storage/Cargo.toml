[package]
name = "w9pt-fs-storage"
version = "0.1.0-dev"
publish = false
edition = "2024"
rust-version = "1.94.1"
description = "Backend-neutral immutable content storage methods for w9pt"
license = "Apache-2.0"
readme = "../../README.md"
keywords = ["9p", "filesystem", "object-storage"]
categories = ["filesystem"]

[features]
default = []
compression-lz4 = ["dep:lz4_flex"]
encryption-aes-siv = ["dep:aes-siv"]

[dependencies]
aes-siv = { version = "=0.8.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
blake3 = "1.8.2"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"], optional = true }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
