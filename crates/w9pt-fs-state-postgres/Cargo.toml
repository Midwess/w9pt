[package]
name = "w9pt-fs-state-postgres"
version = "0.1.0-dev"
publish = false
edition = "2024"
rust-version = "1.94.1"
description = "PostgreSQL authoritative filesystem state adapter for w9pt"
license = "Apache-2.0"
readme = "../../README.md"
keywords = ["9p", "filesystem", "database", "postgresql"]
categories = ["filesystem", "database"]

[features]
default = []
test-support = []

[dependencies]
w9pt-fs-state = { path = "../w9pt-fs-state" }
w9pt-fs-storage = { path = "../w9pt-fs-storage" }
sea-orm = { version = "=1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio", "with-chrono", "with-rust_decimal"] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
