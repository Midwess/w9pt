services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280}"
    environment:
      POSTGRES_DB: w9pt_test
      POSTGRES_PASSWORD: w9pt_test
      POSTGRES_USER: w9pt_test
    ports:
      - "127.0.0.1:${W9PT_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 1s
      timeout: 5s
      retries: 30
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql
    restart: "no"

  seaweedfs:
    image: "${PROVIDER_IMAGE:-chrislusf/seaweedfs@sha256:f7cbc8bdbbf60a1aaba7d61784a3bdff3ec1e0657f6ad0b26d5b6ab2cd9d0dc6}"
    command:
      - server
      - -s3
      - -s3.port=8333
      - -dir=/data
    ports:
      - "127.0.0.1:${W9PT_SEAWEEDFS_PORT:-18333}:8333"
    tmpfs:
      - /data
    restart: "no"
